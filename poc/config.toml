# DECODE-JOIN PoC (stages 1-3). Every knob lives here; the code reads nothing else.
# Paths are relative to this file. {setting} and {db} are filled in at run time.

[data]
dataset = "bird"
# One DuckDB file per database per setting, as the team's loader writes them.
db_path = "../../datasets/bird_duckdb/{setting}/{db}.duckdb"
# Empty = every file the pattern finds for the chosen setting.
databases = []
setting = "obfuscated"

[output]
dir = "../artifacts/poc"              # artifacts/poc/<dataset>/<setting>/<run>/<db>/...

[profile]
top_k = 10
sample_values = 10
sample_rows = 5
seed = 42
placeholders = ["", "N/A", "NA", "n/a", "null", "NULL", "None", "-", "?", "unknown", "Unknown"]
free_text_min_len = 30                 # avg length above this with spaces = free text
code_max_len = 12                      # short, mostly upper/digits = code

[names]
# "auto" looks at the column names: mostly c1, c2, ... means names carry no meaning.
use = "auto"                           # auto | always | never
opaque_pattern = '^[a-zA-Z]{1,2}\d+$'
opaque_share = 0.8

[keys]
min_score = 0.5
id_name_pattern = '(^id$|_id$|^id_|_key$|^key$|code$|_no$|_num$|^pk)'
reject_roles = ["date", "float", "free_text", "boolean"]

[keys.weights]
uniqueness = 0.3
pattern = 0.3
position = 0.2
name = 0.2

[joins]
containment_min = 0.75                 # tau; swept in the proposal over 0.8 .. 0.99
accept = 60
max_targets = 3
min_source_distinct = 2
# Key columns as FK sources: "never" (proposal default), "pk_to_pk" (allow PK -> PK,
# e.g. BIRD frpm.CDSCode -> schools.CDSCode), or "always".
key_sources = "pk_to_pk"
# Optional gate, not in the proposal (0 = off): the source must use at least this share
# of the target's distinct values. Stops small integers (1..5) that sit inside an id range.
coverage_min = 0.0

[joins.weights]                        # points, adapted from DBAutoDoc; keep the sum at 100
overlap = 40
name = 20
cardinality = 15
target_key = 15
nulls = 10
coverage = 0                           # not in the proposal; try e.g. overlap 30 + coverage 10

[adjudicate]
enabled = true
delta = 10                             # score band width sent to the LLM
# Which side of the cutoff the band sits on: "above" (proposal: the lowest accepted
# records are not added directly), "below", or "both".
band = "above"
sample_rows = 3

[describe]
enabled = true
use_values = true                      # false = name-only ablation (RQ2)
lookup_max_rows = 50                   # tables this small are treated as code -> label lookups
lookup_pairs = 8

[export]
# Minimal stand-in for Stage 4 so retrieval can be measured. Each variant becomes one
# JoinGR graph: which join graph to use, and whether Stage 3 descriptions fill the
# semantic fields. Variants whose inputs are missing are skipped.
variants = ["none", "stats", "llm", "llm+desc"]
table_key = "{db}.{table}"             # how JoinGR names tables; Beaver uses "{table}"

[llm]
provider = "deepseek"                  # deepseek | openai_compatible | fake
model = "deepseek-chat"                # set to the pilot model (proposal: deepseek-v4.1-flash)
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"       # read from the environment or decode-join/.env
temperature = 0
max_tokens = 2048
timeout_s = 60
cache = true

[evaluate]
# Metrics to run, by name (see poc/evaluate/metrics.py). Add or drop freely.
metrics = ["pk", "fk", "fk_by_decision", "llm_usage", "description_status", "description_reference"]
# Ground truth for keys: a Spider-style tables.json, or "duckdb" to read the constraints
# kept in the documented setting's database.
keys_gold = "tables_json"
tables_json = "../../JoinGR-E656/data/bird/dev/dev_tables.json"
documented_setting = "documented"
# original name -> setting name; empty for settings that keep names.
mapping = "../artifacts/graphs/bird/{setting}/mapping.json"
# BIRD ships human column descriptions per database: <dir>/<db>/database_description/<table>.csv
reference_descriptions = "../../datasets/bird/dev_databases"
# Sentence encoder for description vs reference cosine; "" to use token F1 only.
description_encoder = "all-MiniLM-L6-v2"

[evaluate.retrieval]
enabled = true
# The JoinGR graph the PoC output is matched against (node ids, queries, gold columns).
baseline_setting = "{setting}"
encoders = ["minilm", "bge"]
methods = ["vanilla", "heuristic"]
